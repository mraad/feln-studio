[project]
name = "feln-studio"
version = "0.1.0"
description = "One local playground over every North Sea FELN backend: RAG, LoRA GGUF, MLX adapter."
requires-python = ">=3.13,<3.14"
dependencies = [
    "feln",
    "feln-rag",
    "layers-json[model]",
    "pydantic>=2.10",
    "python-dotenv>=1",
    "sqlglot>=26",
]

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.16"]

[tool.uv.sources]
feln = { path = "../feln", editable = true }
feln-rag = { path = "../feln-rag", editable = true }
layers-json = { path = "../layers-json", editable = true }

[tool.uv]
override-dependencies = ["layers-json[model]"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["feln_studio", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feln_studio"]
